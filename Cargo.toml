[package]
name = "aycod"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Guardrails for agentic development: let AI agents write the code, and keep production safe."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AyenaCode/aycod"
homepage = "https://github.com/AyenaCode/aycod"
readme = "README.md"
keywords = ["ai", "agent", "guardrails", "git-hooks", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# `cargo binstall aycod`: the archives the release workflow attaches to each GitHub release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
globset = { version = "0.4", default-features = false }
ignore = "0.4.34"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Panics abort, but the hook path installs a panic hook that exits 2 first (fail-closed).
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
