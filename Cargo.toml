[package]
name = "aycod"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Guardrails around any AI coding agent: the checks decide, not the agent."
publish = false

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
globset = { version = "0.4", default-features = false }
ignore = "0.4.34"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Panics abort, but the hook path installs a panic hook that exits 2 first (fail-closed).
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
