# Every push to main and every pull request: format, lint, tests on Linux (glibc and static musl)
# and macOS, plus the install script and the npm launcher.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--target` is ignored when the toolchain comes from rust-toolchain.toml: add it separately.
      - run: rustup toolchain install --profile minimal && rustup target add ${{ matrix.target }}
      # blake3 compiles C (NEON on aarch64, AVX-512 on x86_64): give it musl's C compiler.
      - name: musl C compiler
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: command -v shellcheck || sudo apt-get install -y shellcheck
      - run: shellcheck install.sh npm/aycod/bin/aycod
      - run: node --check npm/build.mjs && node --check npm/aycod/lib/platform.js && node --check npm/aycod/lib/run.js
